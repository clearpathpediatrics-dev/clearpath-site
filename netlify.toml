# Netlify configuration — ClearPath Pediatrics
# Static site (no build step). Redirects live in the _redirects file.

[build]
  publish = "."
  command = ""

# Serverless functions (Stripe purchase verification + gated kit delivery).
# included_files bundles the paid product files INTO the function so it can
# read them — they are never served as public static assets (see the forced
# 404 redirect below).
[functions]
  directory = "netlify/functions"
  included_files = ["private/**", "netlify/lib/**", "assets/logo-white-420.png"]
  node_bundler = "esbuild"

# HARD BLOCK: the paid product lives in /private. Never serve it directly.
# force = true is REQUIRED — without it a matching static file wins over the
# redirect and the paid kit would be downloadable for free.
[[redirects]]
  from = "/private/*"
  to = "/404.html"
  status = 404
  force = true

# Long-cache fingerprint-free static assets (images, badge)
# Images and fonts can be cached for a year: when one changes it gets a new
# file name. Scripts and styles keep their names, so they must revalidate on
# every visit (a cheap 304 when unchanged), or a fix to analytics.js or
# capture.js would not reach a returning visitor for up to a year.
[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Always revalidate HTML so updates show immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline security headers (no CSP — would block Klaviyo/Calendly/Fonts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# ---- Lead funnel -------------------------------------------------------------
# submission-created-background fires on every care-roadmap submission: triage,
# build the personalised Starter Plan PDF, email it, alert, enroll in nurture.
# nurture runs daily on a schedule. Both need RESEND_API_KEY.
[[headers]]
  for = "/.netlify/functions/unsubscribe"
  [headers.values]
    X-Robots-Tag = "noindex"
