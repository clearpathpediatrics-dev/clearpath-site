name: Daily blog post

# Publishes one new ClearPath Pediatrics blog post every morning.
# 15:00 UTC = 8:00 AM in Phoenix (Arizona is UTC-7 year-round, no DST).
on:
  schedule:
    # Multiple daily triggers as fallbacks — GitHub's scheduled runs are best-effort
    # and can be dropped/delayed. The generator only posts once per day (it skips if
    # today already has a post), so at most ONE post publishes per day.
    - cron: "0 15 * * *"    # 8:00 AM Phoenix (primary)
    - cron: "0 18 * * *"    # 11:00 AM Phoenix (fallback)
    - cron: "0 21 * * *"    # 2:00 PM Phoenix (fallback)
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab (great for testing)

permissions:
  contents: write           # allows the action to commit the new post back to the repo

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk@^0.70.0

      # Runs the whole publish path with a canned article instead of an API
      # call: angle selection, rendering, related posts, topic hubs, sitemap and
      # guide. Free, and it fails loudly. On the sister site a reference that only
      # the live path reached stopped publishing for three days while every local
      # check stayed green; this is the step that catches that class of bug.
      #
      # The dry run writes real files, so put the tree back before the paid run.
      # Safe here: the checkout is fresh, so anything untracked under blog/ is
      # what the dry run just made.
      - name: Smoke-test the publish path
        run: |
          CLEARPATH_BLOG_DRYRUN=1 node scripts/generate-blog-post.mjs
          git checkout -- .
          git clean -fdq blog/
          git status --porcelain

      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLEARPATH_POSTS_PER_RUN: "3"
        run: node scripts/generate-blog-post.mjs

      - name: Commit & push
        run: |
          git config user.name  "ClearPath Blog Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            # The guide pages are rebuilt on every run too. They were never
            # added here, so the live guide never received a single new post.
            git add blog/ sitemap.xml pediatric-care-navigation-guide/ care-navigator-vs-case-manager/
            git commit -m "blog: new post ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes to commit."
          fi
